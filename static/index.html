<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canasta MVP — Comparador de Supermercados</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
    }

    header {
      background: #2ecc71;
      color: white;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    header h1 { font-size: 22px; font-weight: 700; }
    header span { font-size: 28px; }

    .container { max-width: 700px; margin: 0 auto; padding: 24px 16px; }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 14px; color: #555; text-transform: uppercase; letter-spacing: 0.5px; }

    /* Input de producto */
    .add-item {
      display: flex;
      gap: 10px;
    }
    .add-item input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .add-item input:focus { border-color: #2ecc71; }
    .add-item button {
      background: #2ecc71;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .add-item button:hover { background: #27ae60; }

    /* Lista de items */
    #lista-items { list-style: none; margin-top: 12px; }
    #lista-items li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #f9f9f9;
      border-radius: 10px;
      margin-bottom: 6px;
      font-size: 15px;
    }
    #lista-items li span { flex: 1; }
    #lista-items li button {
      background: none;
      border: none;
      color: #ccc;
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
    }
    #lista-items li button:hover { color: #e74c3c; }

    /* Boton comparar */
    #btn-comparar {
      width: 100%;
      padding: 16px;
      background: #2ecc71;
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.2s, transform 0.1s;
    }
    #btn-comparar:hover { background: #27ae60; }
    #btn-comparar:active { transform: scale(0.98); }
    #btn-comparar:disabled { background: #b2dfdb; cursor: not-allowed; }

    /* Loading */
    .loading {
      text-align: center;
      padding: 32px;
      color: #888;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #e0e0e0;
      border-top-color: #2ecc71;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Resultados - ganador */
    .ganador-badge {
      background: linear-gradient(135deg, #2ecc71, #27ae60);
      color: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      text-align: center;
    }
    .ganador-badge .emoji { font-size: 40px; }
    .ganador-badge h3 { font-size: 22px; font-weight: 700; margin: 8px 0 4px; }
    .ganador-badge p { font-size: 15px; opacity: 0.9; }

    /* Tabla de totales */
    .totales-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .total-card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border: 2px solid transparent;
    }
    .total-card.winner { border-color: #2ecc71; }
    .total-card .super-name { font-size: 13px; color: #888; margin-bottom: 4px; }
    .total-card .super-price { font-size: 24px; font-weight: 700; color: #1a1a1a; }
    .total-card.winner .super-price { color: #2ecc71; }
    .total-card .ahorro { font-size: 12px; color: #e74c3c; font-weight: 600; margin-top: 4px; }

    /* Desglose por producto */
    .producto-row {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .producto-row h4 { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
    .precio-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #f5f5f5;
      font-size: 14px;
    }
    .precio-row:last-child { border-bottom: none; }
    .precio-row .super { color: #555; }
    .precio-row .precio { font-weight: 600; }
    .precio-row .nombre-producto { font-size: 12px; color: #aaa; margin-left: 8px; flex: 1; }
    .precio-row.mejor .super { color: #2ecc71; font-weight: 700; }
    .precio-row.mejor .precio { color: #2ecc71; }
    .tag-mejor {
      background: #e8f5e9;
      color: #2ecc71;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
    }

    .empty-state {
      text-align: center;
      padding: 24px;
      color: #aaa;
      font-size: 14px;
    }

    #resultados { display: none; }
  </style>
</head>
<body>

<header>
  <span>🛒</span>
  <h1>Canasta — Compara precios</h1>
</header>

<div class="container">

  <!-- Lista de compras -->
  <div class="card">
    <h2>Tu lista de compras</h2>
    <div class="add-item">
      <input type="text" id="input-producto" placeholder="ej: leche entera, pan, huevos..." />
      <button onclick="agregarItem()">+</button>
    </div>
    <ul id="lista-items">
      <li class="empty-state" id="empty-msg">Añade productos a tu lista</li>
    </ul>
  </div>

  <button id="btn-comparar" onclick="comparar()" disabled>
    Comparar precios en 4 supermercados →
  </button>

  <!-- Loading -->
  <div id="loading" style="display:none" class="card">
    <div class="loading">
      <div class="spinner"></div>
      <p>Consultando precios en Mercadona, DIA, Eroski y Ahorramas...</p>
    </div>
  </div>

  <!-- Resultados -->
  <div id="resultados">
    <div id="ganador-container"></div>
    <div id="totales-container" class="totales-grid"></div>
    <div class="card">
      <h2>Desglose por producto</h2>
      <div id="desglose-container"></div>
    </div>
  </div>

</div>

<script>
  let items = [];

  const inputEl = document.getElementById('input-producto');
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') agregarItem(); });

  function agregarItem() {
    const val = inputEl.value.trim();
    if (!val) return;
    if (items.includes(val)) { inputEl.value = ''; return; }
    items.push(val);
    inputEl.value = '';
    renderLista();
  }

  function eliminarItem(i) {
    items.splice(i, 1);
    renderLista();
  }

  function renderLista() {
    const ul = document.getElementById('lista-items');
    const empty = document.getElementById('empty-msg');
    const btn = document.getElementById('btn-comparar');

    if (items.length === 0) {
      ul.innerHTML = '<li class="empty-state" id="empty-msg">Añade productos a tu lista</li>';
      btn.disabled = true;
      return;
    }

    ul.innerHTML = items.map((item, i) => `
      <li>
        <span>🛒 ${item}</span>
        <button onclick="eliminarItem(${i})">✕</button>
      </li>
    `).join('');
    btn.disabled = false;
  }

  async function comparar() {
    if (items.length === 0) return;

    document.getElementById('loading').style.display = 'block';
    document.getElementById('resultados').style.display = 'none';
    document.getElementById('btn-comparar').disabled = true;

    try {
      const res = await fetch('/comparar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items })
      });
      const data = await res.json();
      renderResultados(data);
    } catch (e) {
      alert('Error al comparar precios. Intenta de nuevo.');
      console.error(e);
    } finally {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('btn-comparar').disabled = false;
    }
  }

  function renderResultados(data) {
    const { items: itemsData, totales, mejor_canasta } = data;
    const supermarkets = Object.keys(totales).sort((a, b) => totales[a] - totales[b]);
    const maxTotal = Math.max(...Object.values(totales));

    // Ganador
    const ganadorEl = document.getElementById('ganador-container');
    if (mejor_canasta) {
      const ahorro = maxTotal - totales[mejor_canasta];
      ganadorEl.innerHTML = `
        <div class="ganador-badge">
          <div class="emoji">🏆</div>
          <h3>${mejor_canasta}</h3>
          <p>Mejor precio para tu canasta completa</p>
          ${ahorro > 0 ? `<p style="margin-top:8px;font-size:18px;font-weight:700">Total: ${totales[mejor_canasta].toFixed(2)}€ — Ahorras ${ahorro.toFixed(2)}€</p>` : ''}
        </div>
      `;
    }

    // Totales
    const totalesEl = document.getElementById('totales-container');
    totalesEl.innerHTML = supermarkets.map(s => {
      const ahorro = maxTotal - totales[s];
      return `
        <div class="total-card ${s === mejor_canasta ? 'winner' : ''}">
          <div class="super-name">${s}</div>
          <div class="super-price">${totales[s].toFixed(2)}€</div>
          ${ahorro > 0 && s !== mejor_canasta ? `<div class="ahorro">+${ahorro.toFixed(2)}€ más</div>` : ''}
          ${s === mejor_canasta ? '<div style="font-size:11px;color:#2ecc71;margin-top:4px">✓ MÁS BARATO</div>' : ''}
        </div>
      `;
    }).join('');

    // Desglose
    const desgloseEl = document.getElementById('desglose-container');
    desgloseEl.innerHTML = Object.entries(itemsData).map(([item, itemData]) => {
      const supList = Object.entries(itemData.supermercados)
        .sort((a, b) => a[1].price - b[1].price);
      const mejor = itemData.mejor_precio;

      return `
        <div class="producto-row">
          <h4>🛒 ${item}</h4>
          ${supList.map(([s, p]) => `
            <div class="precio-row ${s === mejor?.supermarket ? 'mejor' : ''}">
              <span class="super">${s}</span>
              <span class="nombre-producto">${p.name.substring(0, 30)}${p.name.length > 30 ? '…' : ''}</span>
              <span class="precio">${p.price.toFixed(2)}€</span>
              ${s === mejor?.supermarket ? '<span class="tag-mejor">✓ mejor</span>' : ''}
            </div>
          `).join('')}
          ${supList.length === 0 ? '<p style="color:#aaa;font-size:13px">No encontrado</p>' : ''}
        </div>
      `;
    }).join('');

    document.getElementById('resultados').style.display = 'block';
    document.getElementById('resultados').scrollIntoView({ behavior: 'smooth' });
  }
</script>

</body>
</html>
